{% extends "base.html" %}
{% block title %}{{ 'New item' if is_new else 'Edit item' }} · {{ app_name }}{% endblock %}
{% block content %}
<div class="card p-4 mx-auto form-card">
  <h1 class="h3 mb-3">{{ 'New item' if is_new else 'Edit item' }}</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="title">Title</label>
      <input class="form-control" id="title" name="title" required maxlength="120" value="{{ item['title'] }}" autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="description">Description</label>
      <textarea class="form-control" id="description" name="description" rows="4" maxlength="2000">{{ item['description'] }}</textarea>
    </div>
    <div class="mb-4">
      <label class="form-label" for="status">Status</label>
      <select class="form-select" id="status" name="status">
        {% for s in statuses %}<option value="{{ s }}" {% if item['status'] == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-primary">{{ 'Add item' if is_new else 'Save changes' }}</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('dashboard') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
