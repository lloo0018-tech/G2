{% extends "base.html" %}
{% block title %}Sign up · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card card p-4 mx-auto">
  <h1 class="h3 mb-3">Create an account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" name="username" required minlength="3" maxlength="30"
             value="{{ request.form.get('username', '') }}" autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password (6+ characters)</label>
      <input class="form-control" id="password" name="password" type="password" required minlength="6">
    </div>
    <button class="btn btn-primary w-100">Sign up</button>
  </form>
  <p class="text-center small mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
