{% extends "base.html" %}
{% block title %}Sign up · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card card p-4 mx-auto">
  <h1 class="h3 mb-3">Create an account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="name">Your name</label>
      <input class="form-control" id="name" name="name" required minlength="2" maxlength="80"
             value="{{ request.form.get('name', '') }}" autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="email">Email address</label>
      <input class="form-control" id="email" name="email" type="email" required maxlength="254"
             value="{{ request.form.get('email', '') }}">
    </div>
    <div class="mb-3">
      <label class="form-label" for="role">Account type</label>
      <select class="form-select" id="role" name="role" required>
        <option value="sme" {% if request.form.get('role', 'sme') == 'sme' %}selected{% endif %}>SME business</option>
        <option value="firm" {% if request.form.get('role') == 'firm' %}selected{% endif %}>Accounting or audit firm</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password (6-128 characters)</label>
      <input class="form-control" id="password" name="password" type="password" required minlength="6" maxlength="128">
    </div>
    <button class="btn btn-primary w-100">Sign up</button>
  </form>
  <p class="text-center small mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
