{% extends "base.html" %}
{% block title %}Log in · {{ app_name }}{% endblock %}
{% block content %}
<div class="auth-card card p-4 mx-auto">
  <h1 class="h3 mb-3">Log in</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input class="form-control" id="username" name="username" required
             value="{{ request.form.get('username', '') }}" autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" name="password" type="password" required>
    </div>
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="text-center small mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
