# One-click deploy on Render (free plan). See README, Part 2, Option B.
services:
  - type: web
    name: student-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_NAME
        value: Student App
      - key: PYTHON_VERSION
        value: 3.12.7
